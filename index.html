<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>មីហឹរកង់៣ — Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d7191f; --red-dark:#a50f14; --yellow:#ffc21a; --cream:#fff8ec;
    --ink:#2a1210; --muted:#8b6f6a; --green:#1fa37a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Kantumruy Pro',sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}

  /* HERO */
  .hero{position:relative;background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);
        color:#fff;padding:22px 18px 70px;overflow:hidden;border-radius:0 0 28px 28px}
  .hero::before{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--yellow);opacity:.95}
  .hero::after{content:"";position:absolute;right:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
  .logo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none;background:#fff}
  .brand h1{font-family:'Moul',serif;font-size:22px;line-height:1.5;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .brand p{font-size:12px;letter-spacing:1px;opacity:.9;text-transform:uppercase}
  .badges{display:flex;gap:6px;margin-top:6px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
  .badge.halal{background:var(--green)}

  /* TABS */
  .tabs-wrap{position:sticky;top:0;z-index:10;margin-top:-44px;padding:0 14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;background:#fff;padding:8px;border-radius:18px;box-shadow:0 8px 24px rgba(165,15,20,.15);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;border:none;padding:10px 14px;border-radius:12px;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;transition:.2s}
  .tab.active{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(215,25,31,.35)}

  h2.section{font-size:17px;margin:22px 16px 10px;display:flex;align-items:center;gap:8px}
  h2.section::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--red)}

  /* GRID */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
  .item{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.06);animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .thumb{position:relative;aspect-ratio:1;background:#ffe2c8;overflow:hidden}
  .hot{position:absolute;top:8px;left:8px;z-index:2;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .thumb.drink{background:#fff}
  .thumb.drink img{object-fit:contain;padding:6px}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .can{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .thumb .can svg{height:82%}
  .info{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
  .name{font-weight:700;font-size:15px}
  .sub{font-size:11px;color:var(--muted)}
  .price{color:var(--red);font-weight:700;font-size:16px;margin-top:4px}
  .price.ask{color:var(--muted);font-size:13px;font-weight:600}
  .ctrl{margin-top:auto;padding-top:8px}
  .add{width:100%;border:none;padding:9px;border-radius:12px;background:var(--red);color:#fff;font-family:inherit;font-weight:600;font-size:14px}
  .qty{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:12px;padding:3px}
  .qty button{width:34px;height:34px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:20px;line-height:1}
  .qty span{font-weight:700;font-size:16px}

  /* CART BAR */
  #bar{position:fixed;left:12px;right:12px;bottom:14px;z-index:20;transform:translateY(140%);transition:transform .3s ease}
  #bar.show{transform:none}
  #orderBtn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:none;border-radius:18px;
            background:linear-gradient(90deg,var(--yellow),#ffd85c);color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;
            box-shadow:0 10px 24px rgba(0,0,0,.25);border:2px solid var(--ink)}
  #orderBtn .count{background:var(--ink);color:var(--yellow);border-radius:10px;padding:2px 10px;font-size:14px}

  footer{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 8px;line-height:1.8}
  footer a{color:var(--red);text-decoration:none;font-weight:600}

  /* SHEETS (checkout / invoice / report) */
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(30,10,8,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .panel h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .x{border:none;background:var(--cream);width:34px;height:34px;border-radius:50%;font-size:18px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #eadbd6;font-size:14px}
  .row b{white-space:nowrap}
  .tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:12px 0;color:var(--red)}
  .field{width:100%;padding:12px;border:1.5px solid #eadbd6;border-radius:12px;font-family:inherit;font-size:15px;margin-top:8px;background:#fffdf9}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;margin-top:10px}
  .btn.red{background:var(--red);color:#fff}
  .btn.yellow{background:var(--yellow);color:var(--ink)}
  .btn.light{background:var(--cream);color:var(--ink)}
  .btn:disabled{opacity:.6}

  /* INVOICE */
  .inv{border:2px dashed #eadbd6;border-radius:18px;padding:16px;background:#fffdf9}
  .inv-head{text-align:center;border-bottom:2px dashed #eadbd6;padding-bottom:10px;margin-bottom:6px}
  .inv-head img{width:64px;height:64px;border-radius:50%;object-fit:cover}
  .inv-head h4{font-family:'Moul',serif;font-size:17px;margin-top:4px;color:var(--red)}
  .inv-meta{font-size:12px;color:var(--muted);line-height:1.8;margin:6px 0}
  .inv-meta b{color:var(--ink)}
  .paid{display:inline-block;background:var(--green);color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;margin-top:4px}
  .thanks{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}

  /* REPORT */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .kpi{background:var(--cream);border-radius:14px;padding:10px;text-align:center}
  .kpi small{display:block;font-size:11px;color:var(--muted)}
  .kpi strong{font-size:16px;color:var(--red)}
  .msg{font-size:13px;color:var(--muted);text-align:center;padding:10px}
</style>
</head>

function canSVG([body, accent, text], label){
  return `<svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${label}" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
    <ellipse cx="50" cy="172" rx="38" ry="6" fill="#000" opacity=".15"/>
    <rect x="14" y="14" width="72" height="156" rx="14" fill="${body}"/>
    <rect x="14" y="70" width="72" height="44" fill="${accent}"/>
    <rect x="20" y="6" width="60" height="14" rx="6" fill="#cfd3d8"/>
    <rect x="14" y="14" width="72" height="156" rx="14" fill="url(#g${label})"/>
    <text x="50" y="99" text-anchor="middle" font-family="Kantumruy Pro" font-weight="700" font-size="15" fill="${text}">${label}</text>
  </svg>`;
}

function card(p){
  const q = cart[p.id]||0;
  const thumb = (p.hot?`<span class="hot">👍 ពេញនិយម</span>`:"") + (p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy">` : `<div class="can">${canSVG(p.can,p.name)}</div>`);
  const price = p.price ? `<div class="price">${riel(p.price)}</div>` : `<div class="price ask">សួរតម្លៃ</div>`;
  const ctrl = q===0
    ? `<button class="add" onclick="change(${p.id},1)">+ បន្ថែម</button>`
    : `<div class="qty"><button onclick="change(${p.id},-1)">−</button><span>${q}</span><button onclick="change(${p.id},1)">+</button></div>`;
  return `<div class="item"><div class="thumb${p.drink?" drink":""}">${thumb}</div><div class="info">
    <div class="name">${p.name}</div><div class="sub">${p.sub||""}</div>${price}<div class="ctrl">${ctrl}</div></div></div>`;
}

function render(){
  document.getElementById("tabs").innerHTML = cats.map(c=>`<button class="tab ${c===current?'active':''}" onclick="setCat('${c}')">${c==="អាហារ"?"🍜 ":c==="ភេសជ្ជៈ"?"🥤 ":"⭐ "}${c}</button>`).join("");
  const show = current==="ទាំងអស់" ? cats.slice(1) : [current];
  document.getElementById("menu").innerHTML = show.map(c=>
    `<h2 class="section">${c}</h2><div class="grid">${PRODUCTS.filter(p=>p.cat===c).map(card).join("")}</div>`).join("");
}
function setCat(c){ current=c; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function change(id,d){
  cart[id]=Math.max(0,(cart[id]||0)+d);
  if(!cart[id]) delete cart[id];
  tg?.HapticFeedback?.impactOccurred("light");
  render(); updateBar();
}
const total = () => Object.entries(cart).reduce((s,[id,q])=>s+PRODUCTS.find(p=>p.id==id).price*q,0);
function updateBar(){
  const n = Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById("bar").classList.toggle("show", n>0);
  document.getElementById("sum").textContent = `${n} មុខ · ${riel(total())}`;
}

let lastInvoice = null;
function openSheet(id){ document.getElementById(id).classList.add("open"); }
function closeSheet(id){ document.getElementById(id).classList.remove("open"); }
const esc = s => String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cartItems = () => Object.entries(cart).map(([id,q])=>{ const p=PRODUCTS.find(x=>x.id==id); return {name:p.name, qty:q, price:p.price}; });

document.getElementById("orderBtn").onclick = ()=>{
  const items = cartItems();
  document.getElementById("coItems").innerHTML = items.map(i=>
    `<div class="row"><span>${esc(i.name)} × ${i.qty}</span><b>${riel(i.price*i.qty)}</b></div>`).join("");
  document.getElementById("coTotal").textContent = riel(total());
  const u = tg?.initDataUnsafe?.user;
  const nm = document.getElementById("cName");
  if (u && !nm.value) nm.value = [u.first_name,u.last_name].filter(Boolean).join(" ");
  openSheet("checkout");
};

function pad(n){ return String(n).padStart(2,"0"); }
function localInvoiceNo(d){ return `MHK-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; }

async function confirmOrder(){
  const btn = document.getElementById("confirmBtn");
  btn.disabled = true; btn.textContent = "កំពុងបញ្ជូន...";
  const now = new Date();
  const u = tg?.initDataUnsafe?.user;
  const order = {
    inv: localInvoiceNo(now),
    name: document.getElementById("cName").value.trim(),
    phone: document.getElementById("cPhone").value.trim(),
    note: document.getElementById("cNote").value.trim(),
    tg: u?.username ? "@"+u.username : "",
    items: cartItems()
  };
  order.total = order.items.reduce((s,i)=>s+i.price*i.qty,0);
  order.date = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  order.time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  order.saved = false;
  if (SCRIPT_URL){
    try{
      const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(order)});
      const j = await r.json();
      if (j.ok){ order.inv = j.inv || order.inv; order.total = j.total ?? order.total; order.saved = true; } else { order.err = j.error || "unknown"; }
    }catch(e){ order.err = "ភ្ជាប់ Sheet មិនបាន ("+e.message+")"; }
  }
  lastInvoice = order;
  btn.disabled = false; btn.textContent = "✅ បញ្ជាក់ការកុម្ម៉ង់";
  closeSheet("checkout");
  renderInvoice(order);
  openSheet("invoice");
  tg?.HapticFeedback?.notificationOccurred("success");
}

function renderInvoice(o){
  document.getElementById("invBox").innerHTML = `
    <div class="inv-head"><img src="${document.querySelector('.logo').src}" alt=""><h4>មីហឹរកង់៣</h4>
      <div style="font-size:11px;color:var(--muted)">Street Side Spicy Noodles · HALAL<br>📞 012 532 028 | 016 532 028</div></div>
    <div class="inv-meta">
      វិក្កយបត្រលេខ: <b>${esc(o.inv)}</b><br>
      កាលបរិច្ឆេទ: <b>${o.date} ${o.time}</b><br>
      ${o.name?`អតិថិជន: <b>${esc(o.name)}</b><br>`:""}
      ${o.phone?`ទូរស័ព្ទ: <b>${esc(o.phone)}</b><br>`:""}
      ${o.note?`ចំណាំ: <b>${esc(o.note)}</b><br>`:""}
      ${o.saved?`<span class="paid">✓ ហាងបានទទួលការកុម្ម៉ង់</span>`:""}
      ${o.err?`<div style="color:#b00;font-size:11px;margin-top:4px">⚠️ ${esc(o.err)}</div>`:""}
    </div>
    ${o.items.map(i=>`<div class="row"><span>${esc(i.name)}<br><small style="color:var(--muted)">${i.qty} × ${riel(i.price)}</small></span><b>${riel(i.price*i.qty)}</b></div>`).join("")}
    <div class="tot"><span>សរុបត្រូវបង់</span><span>${riel(o.total)}</span></div>
    <p class="thanks">🙏 អរគុណសម្រាប់ការគាំទ្រ!</p>`;
}

function sendToShop(){
  const o = lastInvoice; if(!o) return;
  const lines = o.items.map(i=>`• ${i.name} x${i.qty} = ${riel(i.price*i.qty)}`);
  const msg = `🧾 វិក្កយបត្រ ${o.inv}\n📅 ${o.date} ${o.time}\n`+
    (o.name?`👤 ${o.name}${o.tg?" "+o.tg:""}\n`:"")+(o.phone?`📞 ${o.phone}\n`:"")+(o.note?`📝 ${o.note}\n`:"")+
    `${lines.join("\n")}\n💰 សរុប: ${riel(o.total)}`;
  const url = `https://t.me/${OWNER_USERNAME}?text=${encodeURIComponent(msg)}`;
  if (tg) tg.openTelegramLink(url); else window.open(url,"_blank");
}

function newOrder(){
  for (const k in cart) delete cart[k];
  document.getElementById("cNote").value = "";
  closeSheet("invoice"); render(); updateBar(); window.scrollTo({top:0});
}

/* ===== របាយការណ៍ (សម្រាប់ម្ចាស់ហាង) =====
   បើក: ចុច Logo ៥ ដង ឬ link ...?admin ឬ t.me/MiHeurKang3_bot/Menu?startapp=admin */
(function(){
  const today = new Date();
  document.getElementById("rDate").value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  let taps = 0, timer;
  document.querySelector(".logo").addEventListener("click",()=>{
    taps++; clearTimeout(timer); timer = setTimeout(()=>taps=0,1500);
    if (taps>=5){ taps=0; openSheet("report"); }
  });
  const sp = tg?.initDataUnsafe?.start_param;
  if (location.search.includes("admin") || sp==="admin") openSheet("report");
})();

async function loadReport(){
  const out = document.getElementById("rOut");
  if (!SCRIPT_URL){ out.innerHTML = `<p class="msg">មិនទាន់ភ្ជាប់ Google Sheet (SCRIPT_URL)</p>`; return; }
  out.innerHTML = `<p class="msg">កំពុងទាញទិន្នន័យ...</p>`;
  const pin = document.getElementById("rPin").value, date = document.getElementById("rDate").value;
  try{
    const r = await fetch(`${SCRIPT_URL}?action=report&pin=${encodeURIComponent(pin)}&date=${date}`);
    const j = await r.json();
    if (!j.ok){ out.innerHTML = `<p class="msg">❌ ${esc(j.error||"មានបញ្ហា")}</p>`; return; }
    const items = Object.entries(j.items).sort((a,b)=>b[1].amount-a[1].amount);
    out.innerHTML = `
      <div class="kpis">
        <div class="kpi"><small>ចំណូលសរុប</small><strong>${riel(j.total)}</strong></div>
        <div class="kpi"><small>វិក្កយបត្រ</small><strong>${j.invoices.length}</strong></div>
        <div class="kpi"><small>មុខលក់</small><strong>${j.qty}</strong></div>
      </div>
      <h3 style="font-size:15px">តាមមុខទំនិញ</h3>
      ${items.length?items.map(([n,v])=>`<div class="row"><span>${esc(n)} × ${v.qty}</span><b>${riel(v.amount)}</b></div>`).join(""):`<p class="msg">មិនទាន់មានការលក់ថ្ងៃនេះទេ</p>`}
      ${j.invoices.length?`<h3 style="font-size:15px;margin-top:14px">វិក្កយបត្រ</h3>`+
        j.invoices.map(v=>`<div class="row"><span>${esc(v.time)} · ${esc(v.inv)}<br><small style="color:var(--muted)">${esc(v.name||"")}</small></span><b>${riel(v.total)}</b></div>`).join(""):""}`;
  }catch(e){ out.innerHTML = `<p class="msg">❌ ភ្ជាប់មិនបាន សូមសាកម្តងទៀត</p>`; }
}

render();
</script>
