<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>មីហឹរកង់៣ — Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Moul&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d7191f; --red-dark:#a50f14; --yellow:#ffc21a; --cream:#fff8ec;
    --ink:#2a1210; --muted:#8b6f6a; --green:#1fa37a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Kantumruy Pro',sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}

  /* HERO */
  .hero{position:relative;background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);
        color:#fff;padding:22px 18px 70px;overflow:hidden;border-radius:0 0 28px 28px}
  .hero::before{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--yellow);opacity:.95}
  .hero::after{content:"";position:absolute;right:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
  .logo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none;background:#fff}
  .brand h1{font-family:'Moul',serif;font-size:22px;line-height:1.5;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .brand p{font-size:12px;letter-spacing:1px;opacity:.9;text-transform:uppercase}
  .badges{display:flex;gap:6px;margin-top:6px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px)}
  .badge.halal{background:var(--green)}

  /* TABS */
  .tabs-wrap{position:sticky;top:0;z-index:10;margin-top:-44px;padding:0 14px}
  .tabs{display:flex;gap:8px;overflow-x:auto;background:#fff;padding:8px;border-radius:18px;box-shadow:0 8px 24px rgba(165,15,20,.15);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;border:none;padding:10px 14px;border-radius:12px;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;transition:.2s}
  .tab.active{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(215,25,31,.35)}

  h2.section{font-size:17px;margin:22px 16px 10px;display:flex;align-items:center;gap:8px}
  h2.section::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--red)}

  /* GRID */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
  .item{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.06);animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .thumb{position:relative;aspect-ratio:1;background:#ffe2c8;overflow:hidden}
  .hot{position:absolute;top:8px;left:8px;z-index:2;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .thumb.drink{background:#fff}
  .thumb.drink img{object-fit:contain;padding:6px}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .can{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .thumb .can svg{height:82%}
  .info{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
  .name{font-weight:700;font-size:15px}
  .sub{font-size:11px;color:var(--muted)}
  .price{color:var(--red);font-weight:700;font-size:16px;margin-top:4px}
  .price.ask{color:var(--muted);font-size:13px;font-weight:600}
  .ctrl{margin-top:auto;padding-top:8px}
  .add{width:100%;border:none;padding:9px;border-radius:12px;background:var(--red);color:#fff;font-family:inherit;font-weight:600;font-size:14px}
  .qty{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:12px;padding:3px}
  .qty button{width:34px;height:34px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:20px;line-height:1}
  .qty span{font-weight:700;font-size:16px}

  /* CART BAR */
  #bar{position:fixed;left:12px;right:12px;bottom:14px;z-index:20;transform:translateY(140%);transition:transform .3s ease}
  #bar.show{transform:none}
  #orderBtn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:none;border-radius:18px;
            background:linear-gradient(90deg,var(--yellow),#ffd85c);color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;
            box-shadow:0 10px 24px rgba(0,0,0,.25);border:2px solid var(--ink)}
  #orderBtn .count{background:var(--ink);color:var(--yellow);border-radius:10px;padding:2px 10px;font-size:14px}

  footer{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 8px;line-height:1.8}
  footer a{color:var(--red);text-decoration:none;font-weight:600}

  /* SHEETS (checkout / invoice / report) */
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(30,10,8,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .panel{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 24px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .panel h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .x{border:none;background:var(--cream);width:34px;height:34px;border-radius:50%;font-size:18px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #eadbd6;font-size:14px}
  .row b{white-space:nowrap}
  .tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:12px 0;color:var(--red)}
  .field{width:100%;padding:12px;border:1.5px solid #eadbd6;border-radius:12px;font-family:inherit;font-size:15px;margin-top:8px;background:#fffdf9}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;margin-top:10px}
  .btn.red{background:var(--red);color:#fff}
  .btn.yellow{background:var(--yellow);color:var(--ink)}
  .btn.light{background:var(--cream);color:var(--ink)}
  .btn:disabled{opacity:.6}

  /* INVOICE */
  .inv{border:2px dashed #eadbd6;border-radius:18px;padding:16px;background:#fffdf9}
  .inv-head{text-align:center;border-bottom:2px dashed #eadbd6;padding-bottom:10px;margin-bottom:6px}
  .inv-head img{width:64px;height:64px;border-radius:50%;object-fit:cover}
  .inv-head h4{font-family:'Moul',serif;font-size:17px;margin-top:4px;color:var(--red)}
  .inv-meta{font-size:12px;color:var(--muted);line-height:1.8;margin:6px 0}
  .inv-meta b{color:var(--ink)}
  .paid{display:inline-block;background:var(--green);color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;margin-top:4px}
  .thanks{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}

  /* REPORT */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
  .kpi{background:var(--cream);border-radius:14px;padding:10px;text-align:center}
  .kpi small{display:block;font-size:11px;color:var(--muted)}
  .kpi strong{font-size:16px;color:var(--red)}
  .msg{font-size:13px;color:var(--muted);text-align:center;padding:10px}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .seg button{padding:12px;border-radius:12px;border:2px solid #eadbd6;background:#fffdf9;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink)}
  .seg button.on{border-color:var(--red);background:#fff0ee;color:var(--red)}
  #delBox{display:none}
  .loc{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1.5px dashed var(--red);background:#fff;color:var(--red);font-family:inherit;font-size:14px;font-weight:600}
  .warn{color:#b00;font-size:12px;margin-top:6px;min-height:0}

  #posBar{display:none;position:sticky;top:0;z-index:30;background:var(--ink);color:var(--yellow);text-align:center;padding:8px;font-weight:700;font-size:14px}
  body.pos #posBar{display:block}

  #printArea{display:none}
  @media print{ body>*{display:none!important} #printArea{display:block!important} #printArea img{width:100%;max-width:80mm} @page{margin:0} }

  .opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .chip{padding:9px 14px;border-radius:20px;border:2px solid #eadbd6;background:#fffdf9;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink)}
  .chip.on{border-color:var(--red);background:#fff0ee;color:var(--red)}
  .lbl{font-weight:700;font-size:14px;margin-top:12px}
  .addon{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed #eadbd6;font-size:15px}
  .addon input{width:22px;height:22px;accent-color:var(--red)}
  .stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 4px}
  .stepper button{width:40px;height:40px;border-radius:12px;border:none;background:var(--red);color:#fff;font-size:22px}
  .stepper span{font-size:20px;font-weight:700;min-width:24px;text-align:center}
  .item.off{opacity:.55}
  .soldout{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:3}
  .ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed #eadbd6;font-size:14px}
  .ln small{color:var(--muted);display:block}
  .mini{display:flex;align-items:center;gap:6px}
  .mini button{width:28px;height:28px;border-radius:8px;border:none;background:var(--cream);font-size:16px;font-weight:700;color:var(--red)}
  .qrbox{text-align:center;background:#fff;border:2px solid var(--red);border-radius:16px;padding:12px;margin-top:12px}
  .qrbox img{width:230px;max-width:100%;border-radius:10px}
  .qrbox b{color:var(--red);font-size:18px}
  .tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
  .tag.no{background:#ffe1e1;color:#b00}.tag.yes{background:#dff5ec;color:#0a7a52}
  body.pos .cust{display:none}
</style>
</head>

let cart = [];   // {key,id,spice,addons:[],qty}
const addonPrice = names => names.reduce((s,n)=>s+((ADDONS.find(a=>a.name===n)||{}).price||0),0);
const unitOf = l => (byId(l.id)?.price||0) + addonPrice(l.addons);

function addLine(id, spice, addons, q){
  const key = [id, spice||"", ...(addons||[]).slice().sort()].join("|");
  const l = cart.find(x=>x.key===key);
  if (l) l.qty += q; else if (q>0) cart.push({key,id,spice:spice||"",addons:addons||[],qty:q});

  tg?.HapticFeedback?.impactOccurred("light");
  render(); updateBar();
}
function change(id,d){ const p=byId(id); if(!p||!p.avail) return; if(p.opts && d>0) return openOptions(id);

function card(p){
  const q = qtyOf(p.id);
  const thumb = (p.hot?`<span class="hot">👍 ពេញនិយម</span>`:"") + (!p.avail?`<div class="soldout">អស់ហើយ</div>`:"") +
    `<img src="${esc(imgSrc(p.img))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
  let ctrl;
  if (!p.avail) ctrl = `<button class="add" disabled style="background:#bbb">អស់ហើយ</button>`;
  else if (p.opts) ctrl = `<button class="add" onclick="openOptions('${p.id}')">${q?`✓ ${q} · ជ្រើសថែម`:"+ ជ្រើសរើស"}</button>`;
  else ctrl = q===0 ? `<button class="add" onclick="change('${p.id}',1)">+ បន្ថែម</button>`
    : `<div class="qty"><button onclick="change('${p.id}',-1)">−</button><span>${q}</span><button onclick="change('${p.id}',1)">+</button></div>`;
  return `<div class="item${p.avail?"":" off"}"><div class="thumb${p.cat==="ភេសជ្ជៈ"?" drink":""}">${thumb}</div><div class="info">
    <div class="name">${esc(p.name)}</div><div class="sub">${esc(p.sub)}</div><div class="price">${riel(p.price)}</div><div class="ctrl">${ctrl}</div></div></div>`;
}
function render(){
  const cs = cats(); if (!cs.includes(current)) current = "ទាំងអស់";
  document.getElementById("tabs").innerHTML = cs.map(c=>`<button class="tab ${c===current?'active':''}" onclick="setCat('${esc(c)}')">${c==="អាហារ"?"🍜 ":c==="ភេសជ្ជៈ"?"🥤 ":c==="ទាំងអស់"?"⭐ ":""}${esc(c)}</button>`).join("");
  const show = current==="ទាំងអស់" ? cs.slice(1) : [current];
  document.getElementById("menu").innerHTML = show.map(c=>
    `<h2 class="section">${esc(c)}</h2><div class="grid">${MENU.filter(p=>p.cat===c).map(card).join("")}</div>`).join("");
}
function setCat(c){ current=c; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function updateBar(){
  const n = cart.reduce((a,l)=>a+l.qty,0);
  document.getElementById("bar").classList.toggle("show", n>0);
  document.getElementById("sum").textContent = `${n} មុខ · ${riel(total())}`;
}
async function loadMenu(){
  try { const c = JSON.parse(localStorage.getItem("mhk_menu")||"null"); if (c && c.items?.length){ MENU=c.items; ADDONS=c.addons||[]; render(); } } catch(e){}
  if (!SCRIPT_URL) return;
  try {
    const j = await (await fetch(SCRIPT_URL+"?action=menu")).json();
    if (j.ok && j.items?.length){ MENU=j.items; ADDONS=j.addons||[];
      try{ localStorage.setItem("mhk_menu", JSON.stringify({items:MENU,addons:ADDONS})); }catch(e){}
      cart = cart.filter(l=>byId(l.id)?.avail); render(); updateBar(); }
  } catch(e){ console.log(e); }
}

let op = {id:null, spice:"ហឹរ", addons:[], q:1};
function openOptions(id){
  const p = byId(id); op = {id, spice:"ហឹរ", addons:[], q:1};
  document.getElementById("opTitle").textContent = p.name;
  const av = ADDONS.filter(a=>a.avail!==false);
  document.getElementById("opAddWrap").style.display = av.length ? "" : "none";
  document.getElementById("opAddons").innerHTML = av.map((a,i)=>
    `<label class="addon"><span><input type="checkbox" onchange="opToggle(${i},this.checked)"> ${esc(a.name)}</span><b>+${riel(a.price)}</b></label>`).join("");
  opRender(); openSheet("options");
}
function opToggle(i,on){ const n = ADDONS.filter(a=>a.avail!==false)[i].name;
  op.addons = on ? [...op.addons, n] : op.addons.filter(x=>x!==n); opRender(); }

  if (m==="delivery" && !addr && !mapLink){ warn.textContent = "⚠️ សូមវាយអាសយដ្ឋាន ឬចុចចែករំលែកទីតាំង"; return; }
  warn.textContent = "";
  if (!POS) { try { tg?.requestWriteAccess?.(()=>{}); } catch(e){} }
  const btn = document.getElementById("confirmBtn");
  btn.disabled = true; btn.textContent = "កំពុងបញ្ជូន...";
  const now = new Date(), u = tg?.initDataUnsafe?.user;
  const userNote = POS ? "" : document.getElementById("cNote").value.trim();
  const o = {
    inv: `MHK-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`,
    name: POS ? "លក់នៅហាង" : document.getElementById("cName").value.trim(),
    phone: POS ? "" : phone, method: m, pay, addr: POS?"":addr, map: POS?"":mapLink, userNote,
    tg: !POS && u?.username ? "@"+u.username : "", uid: !POS && u?.id ? String(u.id) : "",
    items: cart.map(l=>({id:l.id, name:byId(l.id)?.name, qty:l.qty, spice:l.spice, addons:l.addons, price:unitOf(l), opt:optText(l)})),
    date: `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`, time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    saved:false

  o.total = o.items.reduce((s,i)=>s+i.price*i.qty,0);

/* ---------- វិក្កយបត្ររូបភាព (80mm) ---------- */
let rcptURL = "";
async function makeReceipt(o){
  try { await document.fonts.load('700 20px "Kantumruy Pro"'); await document.fonts.ready; } catch(e){}
  const W = 576, P = 28, F = '"Kantumruy Pro", sans-serif';
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const info = [["លេខវិក្កយបត្រ", o.inv],["កាលបរិច្ឆេទ", o.date+" "+o.time],["ការទទួល", methodName(o.method).slice(2).trim()]];
  if (o.name && o.method!=="pos") info.push(["អតិថិជន", o.name]);
  if (o.phone) info.push(["ទូរស័ព្ទ", o.phone]);
  if (o.addr) info.push(["អាសយដ្ឋាន", o.addr]);
  if (o.userNote) info.push(["ចំណាំ", o.userNote]);
  info.push(["បង់ប្រាក់", o.pay==="khqr"?"ABA / KHQR":"សាច់ប្រាក់"]);
  c.width = W; c.height = 500 + info.length*34 + o.items.length*92;
  x.fillStyle = "#fff"; x.fillRect(0,0,W,c.height); x.fillStyle = "#000";
  let y = P;
  const logo = document.querySelector(".logo");
  try { x.save(); x.beginPath(); x.arc(W/2, y+60, 60, 0, Math.PI*2); x.clip(); x.drawImage(logo, W/2-60, y, 120, 120*logo.naturalHeight/logo.naturalWidth); x.restore(); } catch(e){}
  y += 150;
  const center = (s, f, dy) => { x.font = f; x.textAlign="center"; x.fillText(s, W/2, y); y += dy; };
  const fit = (s, w) => { s=String(s); if (x.measureText(s).width<=w) return s; while (x.measureText(s+"…").width > w && s.length>1) s = s.slice(0,-1); return s+"…"; };
  center("មីហឹរកង់៣", `700 34px ${F}`, 34);
  center("Street Side Spicy Noodles · HALAL", `400 20px ${F}`, 28);
  center("012 532 028 | 016 532 028", `400 20px ${F}`, 22);
  const dash = () => { x.setLineDash([6,6]); x.beginPath(); x.moveTo(P,y); x.lineTo(W-P,y); x.strokeStyle="#000"; x.lineWidth=2; x.stroke(); x.setLineDash([]); y += 34; };
  dash();
  info.forEach(([k,v]) => { x.font=`400 21px ${F}`; x.textAlign="left"; x.fillText(k+":", P, y);
    x.font=`700 21px ${F}`; x.textAlign="right"; x.fillText(fit(v, W-P*2-170), W-P, y); y += 34; });
  y -= 6; dash();
  o.items.forEach(i => {
    x.textAlign="left"; x.font=`700 23px ${F}`; x.fillText(fit(i.name, W-P*2-150), P, y);
    x.textAlign="right"; x.fillText(riel(i.price*i.qty), W-P, y); y += 28;
    x.textAlign="left"; x.font=`400 19px ${F}`;
    if (i.opt){ x.fillText(fit(i.opt, W-P*2), P, y); y += 26; }
    x.fillText(`${i.qty} × ${riel(i.price)}`, P, y); y += 34;
  });
  y -= 6; dash();
  x.font=`700 30px ${F}`; x.textAlign="left"; x.fillText("សរុប", P, y); x.textAlign="right"; x.fillText(riel(o.total), W-P, y); y += 50;
  center("អរគុណសម្រាប់ការគាំទ្រ!", `400 22px ${F}`, 30);
  center("Thank you!", `400 18px ${F}`, 20);
  const out = document.createElement("canvas"); out.width = W; out.height = Math.ceil(y + P);
  out.getContext("2d").drawImage(c, 0, 0);
  return out.toDataURL("image/png");
}
async function showReceipt(){ if (!lastInvoice) return;
  rcptURL = await makeReceipt(lastInvoice); document.getElementById("rcptImg").src = rcptURL; openSheet("receipt"); }
function printReceipt(){ document.getElementById("printArea").innerHTML = `<img src="${rcptURL}">`;
  setTimeout(()=>{ try{ window.print(); }catch(e){ shareReceipt(); } }, 200); }
async function shareReceipt(){
  try{ const blob = await (await fetch(rcptURL)).blob();
    const file = new File([blob], (lastInvoice?.inv||"invoice")+".png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"វិក្កយបត្រ"}); return; }
  }catch(e){}
  const a = document.createElement("a"); a.href = rcptURL; a.download = (lastInvoice?.inv||"invoice")+".png"; a.click();
}

      <div class="kpis">
        <div class="kpi"><small>ចំណូលសរុប</small><strong>${riel(j.total)}</strong></div>
        <div class="kpi"><small>វិក្កយបត្រ</small><strong>${j.invoices.length}</strong></div>
        <div class="kpi"><small>មុខលក់</small><strong>${j.qty}</strong></div>
        <div class="kpi"><small>បានបង់</small><strong style="color:#0a7a52">${riel(j.paid||0)}</strong></div>
        <div class="kpi"><small>មិនទាន់បង់</small><strong>${riel(j.unpaid||0)}</strong></div>
        <div class="kpi"><small>KHQR</small><strong>${riel(j.khqr||0)}</strong></div>
      </div>
      <h3 style="font-size:15px">តាមមុខទំនិញ</h3>
      ${items.length?items.map(([n,v])=>`<div class="row"><span>${esc(n)} × ${v.qty}</span><b>${riel(v.amount)}</b></div>`).join(""):`<p class="msg">មិនទាន់មានការលក់ថ្ងៃនេះទេ</p>`}
      ${j.invoices.length?`<h3 style="font-size:15px;margin-top:14px">វិក្កយបត្រ</h3>`+
        j.invoices.map(v=>`<div class="row"><span>${esc(v.time)} · ${esc(v.inv)}<br><small style="color:var(--muted)">${esc(v.name||"")} · ${esc(v.status||"")}</small></span><b>${riel(v.total)}<br><span class="tag ${v.paid==="បានបង់"?"yes":"no"}">${esc(v.paid||"")}</span></b></div>`).join(""):""}`;
  }catch(e){ out.innerHTML = `<p class="msg">❌ ភ្ជាប់មិនបាន សូមសាកម្តងទៀត</p>`; }
}

applyPOS();
render();
loadMenu();
</script>
</body>
</html>
